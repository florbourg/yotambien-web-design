<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yo También! · Diseño</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#/produccion">Yo También! <span>Diseño</span></a>
    <nav class="tabs" aria-label="Secciones">
      <a href="#/produccion" data-tab="produccion">Producción</a>
      <a href="#/progreso" data-tab="progreso">En progreso</a>
      <a href="#/ds" data-tab="ds">Design System</a>
      <a href="#/archivo" data-tab="archivo">Archivo</a>
    </nav>
    <a id="penLink" class="pen-link" target="_blank" rel="noopener" hidden>Comentar en pen.dev ↗</a>
  </header>

  <main id="list" class="list" hidden></main>

  <main id="viewer" class="viewer" hidden>
    <aside class="side">
      <nav id="crumbs" class="crumbs" aria-label="Ubicación"></nav>
      <div id="meta" class="meta"></div>
      <ul id="screenList" class="screen-list"></ul>
      <div id="extra" class="extra"></div>
    </aside>
    <section class="stage">
      <div class="toolbar">
        <label><input type="checkbox" id="fit" checked /> Ajustar al ancho</label>
        <a id="openRaw" target="_blank" rel="noopener">Abrir en pestaña nueva ↗</a>
      </div>
      <iframe id="frame" title="Pantalla"></iframe>
    </section>
  </main>

  <p id="error" class="error" hidden></p>
  <script src="app.js"></script>
</body>
</html>
