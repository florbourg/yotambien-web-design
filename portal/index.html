<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yo También! · Diseño</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#">Yo También! <span>Diseño</span></a>
    <nav id="crumbs" aria-label="Ubicación"></nav>
  </header>

  <main id="home" hidden>
    <section class="intro">
      <h1 id="title">Versiones de diseño</h1>
      <p>Exportaciones HTML publicadas desde pen.dev. Cada versión es inmutable.</p>
    </section>
    <ol id="versions" class="versions"></ol>
  </main>

  <main id="viewer" class="viewer" hidden>
    <aside class="screens">
      <div class="vmeta"></div>
      <ul id="screenList"></ul>
      <div class="vlinks"></div>
    </aside>
    <section class="stage">
      <div class="toolbar">
        <label><input type="checkbox" id="fit" checked /> Ajustar al ancho</label>
        <a id="openRaw" target="_blank" rel="noopener">Abrir en pestaña nueva ↗</a>
      </div>
      <iframe id="frame" title="Pantalla"></iframe>
    </section>
  </main>

  <p id="error" class="error" hidden></p>
  <script src="app.js"></script>
</body>
</html>
